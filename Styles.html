<style>
  :root {
    --bg: #FFFBF5;
    --surface: #FFFFFF;
    --text: #1E293B;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --primary: #F97316;
    --primary-hover: #EA580C;
    --primary-soft: #FFEDD5;
    --danger: #DC2626;
    --danger-bg: #FEE2E2;
    --warn: #B45309;
    --warn-bg: #FEF3C7;
    --safe: #0F766E;
    --safe-bg: #CCFBF1;
    --radius: 16px;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 0 0 96px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
    line-height: 1.5;
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* 頂部橫幅 */
  .hero {
    background: linear-gradient(135deg, #FB923C 0%, #EA580C 100%);
    color: #FFFFFF;
    padding: 20px 0 24px;
    border-bottom-left-radius: 24px;
    border-bottom-right-radius: 24px;
    box-shadow: var(--shadow-md);
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }

  .hero-title {
    margin: 0;
    font-size: 1.45rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .deadline-pill {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(6px);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .announcement-box {
    margin-top: 12px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.88rem;
  }

  /* 搜尋與分類工具列 */
  .toolbar {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .search-sort-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .search-input {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    font-size: 0.95rem;
    outline: none;
  }

  .search-input:focus,
  .select-input:focus,
  .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
  }

  .select-input {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    font-size: 0.9rem;
    color: var(--text);
    outline: none;
  }

  .category-pills {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }

  .category-pills::-webkit-scrollbar {
    display: none;
  }

  .pill-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .pill-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #FFFFFF;
  }

  /* 商品網格 */
  .product-grid {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card.sold-out {
    opacity: 0.72;
  }

  .card-media {
    position: relative;
    width: 100%;
    height: 176px;
    background: #FFF7ED;
    overflow: hidden;
  }

  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .media-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    background: linear-gradient(135deg, #FFEDD5, #FED7AA);
  }

  .discount-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #EF4444;
    color: #FFFFFF;
    font-size: 0.78rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(239, 68, 68, 0.35);
  }

  .sold-out-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 0.08em;
  }

  .card-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 8px;
  }

  .expiry-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 0.78rem;
    font-weight: 700;
    align-self: flex-start;
  }

  .expiry-urgent {
    background: var(--danger-bg);
    color: var(--danger);
  }

  .expiry-soon {
    background: var(--warn-bg);
    color: var(--warn);
  }

  .expiry-normal {
    background: var(--safe-bg);
    color: var(--safe);
  }

  .card-title {
    margin: 0;
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--text);
  }

  .card-meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .card-desc {
    font-size: 0.83rem;
    color: var(--text-muted);
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .price-group {
    display: flex;
    flex-direction: column;
  }

  .price-now {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--primary-hover);
    line-height: 1.1;
  }

  .price-orig {
    font-size: 0.78rem;
    color: #94A3B8;
    text-decoration: line-through;
  }

  .btn {
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }

  .btn-primary {
    background: var(--primary);
    color: #FFFFFF;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
  }

  .btn-primary:disabled {
    background: #CBD5E1;
    cursor: not-allowed;
  }

  .qty-stepper {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--primary);
    border-radius: 10px;
    overflow: hidden;
    background: #FFF7ED;
  }

  .qty-btn {
    border: none;
    background: transparent;
    color: var(--primary-hover);
    width: 32px;
    height: 34px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
  }

  .qty-btn:disabled {
    color: #CBD5E1;
    cursor: not-allowed;
  }

  .qty-val {
    min-width: 26px;
    text-align: center;
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--text);
  }

  /* 底部購物車懸浮列 */
  .cart-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.08);
    z-index: 40;
  }

  .cart-bar-inner {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .cart-summary-text {
    display: flex;
    flex-direction: column;
  }

  .cart-count {
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .cart-total {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--primary-hover);
  }

  /* Modal / Drawer */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 60;
  }

  .modal-backdrop.open {
    display: flex;
  }

  @media (min-width: 640px) {
    .modal-backdrop {
      align-items: center;
      padding: 16px;
    }
  }

  .modal-panel {
    background: var(--surface);
    width: 100%;
    max-width: 540px;
    max-height: 90vh;
    overflow-y: auto;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow-md);
  }

  @media (min-width: 640px) {
    .modal-panel {
      border-radius: 20px;
    }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .modal-title {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 800;
  }

  .close-btn {
    border: none;
    background: #F1F5F9;
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 999px;
    font-size: 1.1rem;
    cursor: pointer;
  }

  .cart-items-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .cart-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: #F8FAFC;
    border-radius: 12px;
  }

  .form-group {
    margin-bottom: 12px;
  }

  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--text);
  }

  .required-mark {
    color: var(--danger);
  }

  .form-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    background: #FFFFFF;
    outline: none;
  }

  /* 狀態提示與骨架 */
  .state-box {
    text-align: center;
    padding: 48px 16px;
    color: var(--text-muted);
  }

  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #0F172A;
    color: #FFFFFF;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    z-index: 80;
    display: none;
    box-shadow: var(--shadow-md);
  }

  .toast.show {
    display: block;
  }

  .success-card {
    text-align: center;
    padding: 12px 4px;
  }

  .success-icon {
    font-size: 3rem;
    margin-bottom: 8px;
  }

  .order-receipt {
    text-align: left;
    background: #F8FAFC;
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 14px;
    margin: 14px 0;
    font-size: 0.88rem;
  }
</style>
